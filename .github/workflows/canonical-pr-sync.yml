name: Prepare canonical MarketPulse release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare:
    if: github.head_ref == 'canonical-production-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical release branch
        uses: actions/checkout@v4
        with:
          ref: canonical-production-20260819
          fetch-depth: 0

      - name: Reconstruct verified canonical source
        if: hashFiles('.marketpulse-release/chunk-*.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat .marketpulse-release/chunk-*.txt | base64 --decode > /tmp/marketpulse-production.zip
          echo "d25dfc83d7dc5c5f861e135da03c3c802f524c572ef1fd3c7f6500f5f9a9a6e3  /tmp/marketpulse-production.zip" | sha256sum -c -
          unzip -tq /tmp/marketpulse-production.zip
          rm -rf /tmp/marketpulse-production
          mkdir -p /tmp/marketpulse-production
          unzip -q /tmp/marketpulse-production.zip -d /tmp/marketpulse-production
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/marketpulse-production/. .
          rm -f .env .env.*

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified canonical source
        if: hashFiles('.marketpulse-release/chunk-*.txt') != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MarketPulse Production Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: deploy canonical production MarketPulse" || exit 0
          git push origin HEAD:canonical-production-20260819
