name: Database Logical Backup

on:
  schedule:
    - cron: '30 02 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKUP_RETENTION_DAYS: '30'

jobs:
  logical-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require backup connection secret
        env:
          MARKETPULSE_DB_URL: ${{ secrets.MARKETPULSE_DB_URL }}
        run: |
          if [ -z "$MARKETPULSE_DB_URL" ]; then
            echo "MARKETPULSE_DB_URL GitHub Actions secret is required for off-site logical backups."
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create encrypted-in-transit logical backup artifact
        env:
          MARKETPULSE_DB_URL: ${{ secrets.MARKETPULSE_DB_URL }}
        run: |
          mkdir -p backup
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          pg_dump "$MARKETPULSE_DB_URL" --format=custom --no-owner --no-privileges --file="backup/marketpulse-$stamp.dump"
          pg_dump "$MARKETPULSE_DB_URL" --schema-only --no-owner --no-privileges --file="backup/marketpulse-$stamp-schema.sql"
          sha256sum backup/* > backup/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: marketpulse-db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
