name: Storage Object Backup

on:
  schedule:
    - cron: '15 03 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require server-side Storage backup secret
        env:
          MARKETPULSE_SUPABASE_SECRET_KEY: ${{ secrets.MARKETPULSE_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$MARKETPULSE_SUPABASE_SECRET_KEY" ]; then
            echo "MARKETPULSE_SUPABASE_SECRET_KEY is required for private Storage exports."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependency
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Export evidence and avatars
        env:
          SUPABASE_URL: https://iqavukfmeahqnovrkcuo.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.MARKETPULSE_SUPABASE_SECRET_KEY }}
          STORAGE_BUCKETS: price-evidence,profile-avatars
          STORAGE_BACKUP_DIR: storage-backup
        run: node scripts/export-storage.mjs
      - name: Create integrity checksums
        run: find storage-backup -type f -print0 | sort -z | xargs -0 sha256sum > storage-backup/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: marketpulse-storage-backup-${{ github.run_id }}
          path: storage-backup/
          retention-days: 30
          if-no-files-found: error
