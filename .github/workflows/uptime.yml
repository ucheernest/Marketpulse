name: MarketPulse Uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  MARKETPULSE_URL: ${{ vars.MARKETPULSE_URL || 'https://marketpulse-khaki.vercel.app' }}
  MARKETPULSE_HEALTH_URL: https://iqavukfmeahqnovrkcuo.supabase.co/functions/v1/marketpulse-health

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check frontend
        run: curl --fail --silent --show-error --location --retry 2 --max-time 20 "$MARKETPULSE_URL/" >/dev/null
      - name: Check backend health
        run: |
          body="$(curl --fail --silent --show-error --location --retry 2 --max-time 20 "$MARKETPULSE_HEALTH_URL")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      - name: Open incident issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[Uptime] MarketPulse health check failed"
          existing="$(gh issue list --state open --search '"'"'[Uptime] MarketPulse health check failed'"'"' in:title' --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "Automated uptime monitoring failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Check the Vercel frontend, Supabase health function, Auth, API and recent deployment changes. Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
